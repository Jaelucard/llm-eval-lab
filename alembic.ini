# Alembic configuration for command-line use (`alembic upgrade head`,
# `alembic check`, `alembic revision --autogenerate`).
#
# The application itself does NOT read this file: `llm-eval db upgrade` builds
# its configuration programmatically in `llm_eval_lab.storage.migrator`, so the
# command works from any working directory and from an installed package. This
# file exists for developer and CI invocations of the `alembic` CLI.
#
# No database URL is set here on purpose. `migrations/env.py` resolves it from
# `LLM_EVAL_DATABASE_URL` or from the application settings, so there is exactly
# one place the database location is decided and no chance of a stale URL
# checked into the repository.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
