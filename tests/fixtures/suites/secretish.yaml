# A suite that plants secret-shaped keys in the two free-form dictionaries a
# benchmark author controls: the suite-level generation `extra`, and an
# evaluator's `params`. Both reach the persisted snapshot body, and neither may
# survive the trip in readable form.
#
# The literal value here is the canary the secret-leak test greps the raw
# database file for.
schema_version: 1
name: secretish
version: "1"
defaults:
  params:
    extra:
      api_key: "sk-canary-DO-NOT-LEAK-0123456789"
      max_output_tokens_hint: 64
cases:
  - id: planted
    input: Say hello.
    expected: hello
    metadata:
      authorization: "Bearer sk-canary-DO-NOT-LEAK-0123456789"
    evaluators:
      - type: exact_match
        params:
          expected: hello
