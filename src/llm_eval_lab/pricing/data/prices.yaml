# Price table shipped with the package.
#
# Every price is quoted per MILLION tokens, in USD, and is written as a QUOTED
# STRING so it parses into an exact Decimal. An unquoted YAML float would go
# through a binary double first and carry that rounding into every cost.
#
# Prices are transcribed from the vendors' official pricing pages, which are
# recorded with their retrieval date in `docs/providers-sources.md`. Inventing
# a vendor price here would produce cost figures nobody could audit, which is
# the specific failure the `source` field exists to prevent. `version` is the
# retrieval date, so a run's recorded price-table version says exactly which
# day's published prices costed it.
#
# Scope, stated once so no cost figure is over-read:
#   * Standard synchronous pricing only. Batch discounts (typically 50%),
#     cache-WRITE premiums, and data-residency multipliers are not modelled.
#   * `cached_input_per_mtok` is the cache-READ (cache-hit) price, which is the
#     only cache figure the returned token counts let us apply.
#   * Where a vendor tiers input price by context length, the base (smaller
#     context) tier is quoted and the entry says so in `notes`.
#   * `ollama` runs locally, so its marginal per-token price is zero. That is a
#     true statement about tokens, not a claim that self-hosting is free.
#   * `openai_compatible` has no entries on purpose: a third-party endpoint's
#     price is set by whoever operates it, so a run against one records
#     priced=false with a reason rather than a fabricated cost. Pass --prices
#     with your own table to cost those runs.
#
# Matching is exact first, then longest prefix, then regex. Dated snapshot ids
# (`gpt-5.1-2026-...`, `claude-haiku-4-5-20251001`) are covered by the prefix
# entries, which is why prefixes are used for model families that ship dated
# snapshots under a stable stem.
id: builtin
version: "2026-09-07"
currency: USD
source: >-
  Official vendor pricing pages retrieved 2026-09-07:
  https://developers.openai.com/api/docs/pricing (OpenAI),
  https://platform.claude.com/docs/en/about-claude/pricing (Anthropic),
  https://ai.google.dev/gemini-api/docs/pricing (Google).
  Standard synchronous rates, per million tokens, USD.
  See docs/providers-sources.md for the full retrieval record.
models:
  # --- fake ---------------------------------------------------------------
  - provider: fake
    model: fake-
    match: prefix
    input_per_mtok: "0"
    output_per_mtok: "0"
    notes: "The fake provider issues no requests, so its true cost is zero."

  # --- ollama -------------------------------------------------------------
  - provider: ollama
    model: ".+"
    match: regex
    input_per_mtok: "0"
    output_per_mtok: "0"
    notes: >-
      Ollama serves models on local hardware, so there is no per-token charge
      to meter. Electricity and hardware are real costs but are not per-token
      and are not this table's unit. Matched by regex rather than by an empty
      prefix: every entry needs a non-empty model key, and ".+" says "any model
      this server serves" without pretending to enumerate them.

