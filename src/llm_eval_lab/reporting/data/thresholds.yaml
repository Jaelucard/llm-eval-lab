# The shipped default regression policy.
#
# Every bound here compares POINT ESTIMATES and resolves deterministically
# (decision D-GATE). The Wilson intervals, the Newcombe Method-10 interval and
# the McNemar exact p-value that the engine attaches to each outcome are
# advisory: they can put a caution in the report, never flip a verdict.
#
# Bound semantics, which the engine implements exactly:
#   min_value              INCLUSIVE floor  - a candidate equal to it PASSES
#   max_value              EXCLUSIVE ceiling - a candidate equal to it FAILS
#   max_absolute_decrease  candidate - baseline may not fall below -value
#   max_relative_increase  candidate may not exceed baseline * (1 + value)
#
# min_samples is a gate, not a filter: a check below it reports
# INSUFFICIENT_DATA, which is visible in the report and never fails a build.
# A sample count the run did not record counts as zero, and therefore as
# insufficient, so a gate is never skipped by accident.
#
# `direction` is descriptive. It labels the metric and picks the arrow a report
# draws; the bounds above are already directional and the engine derives no
# second rule from it.

id: default
version: "1"

# Pair on (case_id, case_hash) whenever the two runs share unchanged cases.
paired: true
# Two runs of different suites are not comparable unless this is turned off.
require_same_suite: true
min_paired_cases: 1
# A policy that names a headline metric the runs do not report is a mismatch
# between the policy and the benchmark, and it fails rather than passing quietly.
fail_on_missing_metric: true
confidence_level: 0.95

checks:
  # The headline gate. In paired mode both rates are computed over the cases
  # both runs ran unchanged, which is the population McNemar and Method 10
  # describe.
  - metric: pass_rate
    label: overall pass rate
    direction: higher_is_better
    max_absolute_decrease: 0.02
    min_samples: 1

  # One gate per category, evaluated only where both runs have enough cases in
  # that bucket for the rate to mean anything.
  - metric: category.*.pass_rate
    label: category pass rate
    direction: higher_is_better
    max_absolute_decrease: 0.02
    min_samples: 10

  # JSON adherence is near-deterministic syntactic behaviour, so any decrease
  # at all is a regression: no tolerance. Scoped to the two JSON evaluators,
  # one outcome per evaluator instance.
  - metric: evaluator_type.json_valid.pass_rate
    label: JSON validity
    direction: higher_is_better
    max_absolute_decrease: 0.0
    min_samples: 1

  - metric: evaluator_type.json_schema.pass_rate
    label: JSON schema adherence
    direction: higher_is_better
    max_absolute_decrease: 0.0
    min_samples: 1

  # Successful-attempt latency, not wall clock: retry backoff lives in
  # total_latency_ms and would make this gate measure a rate limit instead of a
  # model. Twenty samples is the point below which a p95 is near the maximum.
  - metric: latency.p95_ms
    label: p95 model latency
    direction: lower_is_better
    max_relative_increase: 0.15
    min_samples: 20

  # "Error rate must remain below 1%", expressed exactly: an EXCLUSIVE ceiling,
  # so a candidate of exactly 0.01 fails.
  - metric: error_rate
    label: error rate
    direction: lower_is_better
    max_value: 0.01
    min_samples: 1

  # Per evaluator instance, on the normalized 0..1 scale. Evaluators the suite
  # does not use produce no outcome; scores from different evaluators are never
  # blended into one number.
  - metric: evaluator.*.mean_score
    label: mean evaluator score
    direction: higher_is_better
    max_absolute_decrease: 0.05
    min_samples: 1
